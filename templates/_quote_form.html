<form class="quote-form multi-step-form" action="{{ url_for('quote') }}" method="post">
  <input type="hidden" name="source_page" value="{{ request.path }}">
  <div class="form-progress"><span class="step-count">STEP 01 / 02</span><div><i></i></div></div>
  <div class="form-step active" data-step="1"><h3>First, how can we reach you?</h3>
    <label>Your name<input name="name" required minlength="2" placeholder="Full name"></label>
    <label>Mobile number / WhatsApp<input name="phone" required inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" placeholder="10-digit mobile number"></label>
    <label>I'm a<select name="customer_type" required><option value="">Choose one</option><option>Homeowner</option><option>Carpenter / Contractor</option><option>Architect / Interior Designer</option><option>Builder / Project Buyer</option><option>Dealer / Distributor</option><option>Furniture Manufacturer</option></select></label>
    <button class="button button-dark next-step" type="button">Continue to requirements <span>→</span></button>
  </div>
  <div class="form-step" data-step="2"><h3>Tell us about the material.</h3>
    <label>Product / grade<select name="product" required><option value="">Select product</option>{% for p in products %}<option>{{ p.name }}</option>{% endfor %}</select></label>
    <div class="form-row"><label>Thickness<select name="thickness"><option value="">Not sure yet</option>{% for n in [6,8,12,16,19,25] %}<option>{{ n }} mm</option>{% endfor %}</select></label><label>Quantity<input name="quantity" placeholder="e.g. 40 sheets / 800 sq ft"></label></div>
    <label>Delivery city / pincode<input name="delivery_location" required placeholder="e.g. Andheri, Mumbai / 400053"></label>
    <label>Laminate / veneer / other details <textarea name="finish" rows="2" placeholder="Optional"></textarea></label>
    <label>Site / shop address <textarea name="address" rows="2" placeholder="Optional"></textarea></label>
    <div class="form-actions"><button class="button button-outline prev-step" type="button">← Back</button><button class="button button-dark" type="submit">Send enquiry <span>↗</span></button></div>
  </div>
  <p class="form-note">Your details will be used to respond to this enquiry. We do not publish your information.</p>
</form>
