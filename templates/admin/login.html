<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login · Kohinoor Plywood</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f4ef;color:#252b24;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.login{width:min(440px,100%);background:#fff;border:1px solid #e5e8df;border-radius:22px;padding:38px;box-shadow:0 24px 70px #24301e12}.mark{width:48px;height:48px;border-radius:14px;background:#263b2d;color:#fff;display:grid;place-items:center;font:700 24px Georgia;margin-bottom:24px}.eyebrow{color:#71806f;font-size:11px;letter-spacing:.16em;font-weight:800;text-transform:uppercase}h1{font:600 32px Georgia;margin:10px 0}p{color:#748071;line-height:1.6}.field{margin:20px 0 0}label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}input{width:100%;padding:14px;border:1px solid #dce2d8;border-radius:10px;font:inherit;outline:none}input:focus{border-color:#58795a;box-shadow:0 0 0 3px #58795a20}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:#2d4934;color:white;font-weight:750;font-size:14px;cursor:pointer}.alert{padding:12px;border-radius:9px;background:#fff0ed;color:#9d3d2c;font-size:13px;margin:16px 0}.back{display:block;text-align:center;margin-top:22px;color:#526b53;text-decoration:none;font-size:13px}
</style></head><body><main class="login"><div class="mark">K</div><div class="eyebrow">Kohinoor Plywood · Management</div><h1>Welcome back.</h1><p>Sign in to manage website enquiries and dealer applications.</p>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ admin_csrf_token() }}"><div class="field"><label for="username">Admin username</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button type="submit">Sign in securely →</button></form><a class="back" href="{{ url_for('home') }}">← Back to website</a></main></body></html>
