<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard{% endtitle %} | Kohinoor Plywood</title>
    <!-- Font Awesome Icons & Chart.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.7);
            --accent-amber: #d97706;
            --accent-amber-glow: rgba(217, 119, 6, 0.3);
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar Styling */
        .admin-sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .brand-header {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-header i {
            font-size: 1.6rem;
            color: var(--accent-amber);
        }

        .brand-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .nav-menu {
            list-style: none;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .nav-item a:hover, .nav-item.active a {
            background: var(--accent-amber);
            color: #ffffff;
            box-shadow: 0 4px 15px var(--accent-amber-glow);
        }

        /* Main Workspace Content Area */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .top-navbar {
            height: 70px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .content-area {
            padding: 32px;
            flex-grow: 1;
        }

        /* Reusable UI Components */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 24px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-amber-glow);
        }

        /* Table Design */
        .custom-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .custom-table th {
            padding: 14px 18px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .custom-table td {
            padding: 16px 18px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .custom-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
        }
        .toast {
            background: #1e293b;
            color: #fff;
            padding: 14px 20px;
            border-left: 4px solid var(--accent-amber);
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar">
        <div class="brand-header">
            <i class="fa-solid fa-layer-group"></i>
            <h2>KOHINOOR</h2>
        </div>
        <ul class="nav-menu">
            <li class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
                <a href="{{ url_for('admin_dashboard') }}"><i class="fa-solid fa-chart-line"></i> Analytics</a>
            </li>
            <li class="nav-item {% if active_page == 'products' %}active{% endif %}">
                <a href="{{ url_for('admin_products') }}"><i class="fa-solid fa-boxes-stacked"></i> Products Catalog</a>
            </li>
            <li class="nav-item {% if active_page == 'content' %}active{% endif %}">
                <a href="{{ url_for('admin_content') }}"><i class="fa-solid fa-file-pen"></i> Dynamic Content</a>
            </li>
            <li class="nav-item {% if active_page == 'records' %}active{% endif %}">
                <a href="{{ url_for('admin_records') }}"><i class="fa-solid fa-users-gear"></i> Customer Leads</a>
            </li>
            <li class="nav-item" style="margin-top: auto;">
                <a href="{{ url_for('admin_logout') }}" style="color: #ef4444;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </li>
        </ul>
    </aside>

    <!-- Main Content Area -->
    <main class="main-wrapper">
        <header class="top-navbar">
            <h3 style="font-weight: 600;">{% block header_title %}Control Center{% endtitle %}</h3>
            <div class="user-badge">
                <i class="fa-solid fa-user-shield" style="color: var(--accent-amber);"></i>
                <span style="font-size: 0.9rem; font-weight: 500;">Admin User</span>
            </div>
        </header>

        <section class="content-area">
            {% block content %}{% endblock %}
        </section>
    </main>

    <div id="toast-container"></div>

    <script>
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fa-solid fa-circle-info" style="margin-right: 8px;"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
